<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1: Two-Dimensional Image Gallery</title>
  <link rel="stylesheet" href="exercise1.css">
</head>
<body>
  <div class="gallery-wrapper">
    <header class="gallery-header">
      <h1>Two-Dimensional Image Gallery</h1>
      <p>CSS Grid layout with a 15px gap and the first item spanning two columns</p>
    </header>
    <section class="exercise-grid">
      <div class="exercise-item item-1">
        <img src="https://picsum.photos/seed/gallery1/800/400" alt="Item 1">
        <div class="item-label">Item 1 (Spans 2 columns)</div>
      </div>
      <div class="exercise-item">
        <img src="https://picsum.photos/seed/gallery2/400/400" alt="Item 2">
        <div class="item-label">Item 2</div>
      </div>
      <div class="exercise-item">
        <img src="https://picsum.photos/seed/gallery3/400/400" alt="Item 3">
        <div class="item-label">Item 3</div>
      </div>
      <div class="exercise-item">
        <img src="https://picsum.photos/seed/gallery4/400/400" alt="Item 4">
        <div class="item-label">Item 4</div>
      </div>
    </section>
  </div>
</body>
</html>
